<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabel Riwayat Report HOD</title>
    <!-- Library SheetJS untuk Export Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #f1f5f9;
            margin: 0;
            padding: 8px;
            color: #0f172a;
        }
        .container {
            max-width: 100%;
            margin: 0 auto;
            background: #ffffff;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h2 { margin-top: 0; color: #0369a1; font-size: 16px; margin-bottom: 12px; }
        
        /* Area Filter & Search */
        .filter-box {
            background-color: #e0f2fe;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
            border: 1px solid #bae6fd;
        }
        
        .filter-row-dates {
            display: flex;
            gap: 8px;
            width: 100%;
        }

        .filter-group { 
            display: flex; 
            flex-direction: column; 
            width: 100%;
        }
        .filter-group.half {
            width: 50%;
        }
        
        .filter-group label { 
            font-size: 11px; 
            font-weight: bold; 
            margin-bottom: 3px; 
            color: #0369a1; 
        }
        .filter-group input { 
            padding: 7px 8px; 
            border: 1px solid #94a3b8; 
            border-radius: 6px; 
            font-size: 12px; 
            background-color: #ffffff;
            width: 100%;
        }

        .btn-group-action {
            display: flex;
            gap: 8px;
            width: 100%;
            margin-top: 4px;
        }
        .btn {
            padding: 8px 10px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
            color: white;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            flex: 1;
        }
        .btn-excel { background-color: #16a34a; }
        .btn-back { background-color: #475569; }
        
        .btn-edit { background-color: #f59e0b; padding: 4px 8px; font-size: 11px; margin-right: 2px; }
        .btn-delete { background-color: #dc2626; padding: 4px 8px; font-size: 11px; }
        .btn-save { background-color: #16a34a; padding: 4px 8px; font-size: 11px; }

        /* Tabel Responsive */
        .table-responsive { overflow-x: auto; max-height: 70vh; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
            white-space: nowrap;
        }
        th, td {
            border: 1px solid #cbd5e1;
            padding: 6px 8px;
            text-align: center;
        }
        th { background-color: #0284c7; color: white; position: sticky; top: 0; z-index: 10; }
        tr:nth-child(even) { background-color: #f8fafc; }
        
        /* Highlight Header Kategori */
        th.cat-jgr { background-color: #0369a1; }
        th.cat-btl { background-color: #0d9488; }
        th.cat-fg { background-color: #15803d; }
        th.cat-afkir { background-color: #b91c1c; }

        input.editable-cell {
            width: 55px;
            text-align: center;
            font-size: 11px;
            padding: 2px;
            border: 1px solid #0284c7;
            border-radius: 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📊 Rekap Tabel Laporan HOD</h2>

    <div class="filter-box">
        <!-- Search Bar -->
        <div class="filter-group">
            <label>🔍 Cari Data (ID / Tanggal / Waktu):</label>
            <input type="text" id="searchInput" onkeyup="renderTable()" placeholder="Ketik kata kunci...">
        </div>
        
        <!-- Tanggal Mulai & Selesai -->
        <div class="filter-row-dates">
            <div class="filter-group half">
                <label>Tanggal Mulai:</label>
                <input type="date" id="startDate" onchange="renderTable()">
            </div>
            <div class="filter-group half">
                <label>Tanggal Selesai:</label>
                <input type="date" id="endDate" onchange="renderTable()">
            </div>
        </div>

        <!-- Tombol Aksi -->
        <div class="btn-group-action">
            <button class="btn btn-excel" onclick="exportToExcel()">📥 Export Excel</button>
            <a href="index.html" class="btn btn-back">⬅️ Menu</a>
        </div>
    </div>

    <div class="table-responsive">
        <table id="historyTable">
            <thead>
                <tr>
                    <th rowspan="2">Aksi</th>
                    <th rowspan="2">ID</th>
                    <th rowspan="2">Tanggal</th>
                    <th rowspan="2">Jam</th>
                    <!-- Group Jugrack -->
                    <th colspan="6" class="cat-jgr">JUGRACK</th>
                    <!-- Group Botol Siap Pakai -->
                    <th colspan="4" class="cat-btl">BOTOL KOSONG & SIAP PAKAI</th>
                    <!-- Group FG -->
                    <th colspan="3" class="cat-fg">FINISH GOOD (Btl)</th>
                    <!-- Group Afkir -->
                    <th colspan="3" class="cat-afkir">AFKIR 0011</th>
                </tr>
                <tr>
                    <!-- Sub-header Jugrack -->
                    <th class="cat-jgr">Jgr Kosong</th>
                    <th class="cat-jgr">Jgr PC</th>
                    <th class="cat-jgr">Jgr PET</th>
                    <th class="cat-jgr">Jgr 10L</th>
                    <th class="cat-jgr">Total Jgr</th>
                    <th class="cat-jgr">Jgr Rusak</th>
                    <!-- Sub-header Botol Kosong & Siap Pakai -->
                    <th class="cat-btl">Lasahan PC</th>
                    <th class="cat-btl">Lasahan PET</th>
                    <th class="cat-btl">Siap PC</th>
                    <th class="cat-btl">Siap PET</th>
                    <!-- Sub-header FG -->
                    <th class="cat-fg">FG PC</th>
                    <th class="cat-fg">FG PET</th>
                    <th class="cat-fg">FG 10L</th>
                    <!-- Sub-header Afkir -->
                    <th class="cat-afkir">Afkir PC</th>
                    <th class="cat-afkir">Afkir PET</th>
                    <th class="cat-afkir">Afkir Luar</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    // NAMA KUNCI MEMORI (SINKRON DENGAN REPORT SHIFT)
    const DB_KEY = 'data_rekap_tabel';

    // Helper ekstraksi angka murni (Contoh: "10 Jgr (480 Btl)" -> jadi "480")
    function parseOnlyNumber(val) {
        if (typeof val === 'number') return isNaN(val) ? 0 : val;
        if (!val) return 0;
        
        let matchInParen = val.toString().match(/\((\d+)\s*Btl\)/i);
        if (matchInParen) return parseInt(matchInParen[1], 10) || 0;
        
        let matchNum = val.toString().replace(/\./g, '').match(/\d+/);
        return matchNum ? parseInt(matchNum[0], 10) : 0;
    }

    // Load & Standarisasi Data dari Report Shift
    function loadAndNormalizeData() {
        let history = JSON.parse(localStorage.getItem(DB_KEY) || '[]');
        let needsSave = false;

        history.forEach((row, index) => {
            // Buat ID otomatis jika belum ada (Biar bisa di-edit/hapus)
            if (!row.id) {
                row.id = 'RPT-' + Date.now().toString().slice(-4) + '-' + index;
                needsSave = true;
            }
            
            // Pecah "14-Aug-2026 | 18:25:48 WIB" jadi Tanggal dan Jam
            if (row.waktu && !row.tanggal_ymd) {
                let parts = row.waktu.split(' | ');
                row.tanggal_tampil = parts[0] || '-';
                row.jam_tampil = parts[1] ? parts[1].replace(' WIB', '') : '-';
                
                // Konversi tanggal ke format YYYY-MM-DD biar filter kalender jalan
                let dParts = row.tanggal_tampil.split('-');
                let months = { 'Jan':'01', 'Feb':'02', 'Mar':'03', 'Apr':'04', 'May':'05', 'Jun':'06', 'Jul':'07', 'Aug':'08', 'Sep':'09', 'Oct':'10', 'Nov':'11', 'Dec':'12'};
                if(dParts.length === 3) {
                    row.tanggal_ymd = `${dParts[2]}-${months[dParts[1]] || '01'}-${dParts[0].padStart(2, '0')}`;
                }
                needsSave = true;
            }
        });

        // Simpan perbaikan ID & Tanggal ke memori
        if (needsSave) {
            localStorage.setItem(DB_KEY, JSON.stringify(history));
        }
        return history;
    }

    function renderTable() {
        let history = loadAndNormalizeData();
        let tbody = document.getElementById('tableBody');
        let searchVal = document.getElementById('searchInput').value.toLowerCase();
        let startVal = document.getElementById('startDate').value;
        let endVal = document.getElementById('endDate').value;

        tbody.innerHTML = '';

        // Filter Engine
        let filtered = history.filter(item => {
            let matchSearch = (item.id || '').toLowerCase().includes(searchVal) || 
                              (item.tanggal_tampil || '').toLowerCase().includes(searchVal) || 
                              (item.waktu || '').toLowerCase().includes(searchVal);

            let matchDate = true;
            if (startVal && item.tanggal_ymd < startVal) matchDate = false;
            if (endVal && item.tanggal_ymd > endVal) matchDate = false;

            return matchSearch && matchDate;
        });

        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="20" style="text-align:center; padding:20px; color:#64748b;">Belum ada data dari Report Shift. Silakan Submit data dulu!</td></tr>';
            return;
        }

        // Render Data
        filtered.forEach((row) => {
            // Ambil dari key report-shift
            let jgrKosong = parseOnlyNumber(row.jgrKosong);
            let jgrPC = parseOnlyNumber(row.jgrPC);
            let jgrPET = parseOnlyNumber(row.jgrPET);
            let jgr10L = parseOnlyNumber(row.jgr10L);
            let totalJgr = parseOnlyNumber(row.totalJgr);
            let jgrRusak = parseOnlyNumber(row.jgrRusak);

            let lasahanPC = parseOnlyNumber(row.lasahanPC);
            let lasahanPET = parseOnlyNumber(row.lasahanPET);
            let siapPC = parseOnlyNumber(row.siapPC);
            let siapPET = parseOnlyNumber(row.siapPET);

            let fgPC = parseOnlyNumber(row.fgPC);
            let fgPET = parseOnlyNumber(row.fgPET);
            let fg10L = parseOnlyNumber(row.fg10L);

            let afkirPC = parseOnlyNumber(row.afkirPC);
            let afkirPET = parseOnlyNumber(row.afkirPET);
            let afkirLuar = parseOnlyNumber(row.afkirLuar);

            let tr = document.createElement('tr');
            tr.id = `row-${row.id}`;
            tr.innerHTML = `
                <td>
                    <button class="btn btn-edit" onclick="enableEdit('${row.id}')">✏️</button>
                    <button class="btn btn-delete" onclick="deleteRow('${row.id}')">🗑️</button>
                </td>
                <td><strong>${row.id}</strong></td>
                <td>${row.tanggal_tampil}</td>
                <td>${row.jam_tampil}</td>
                
                <!-- Jugrack -->
                <td><span class="view-mode">${jgrKosong}</span><input type="number" class="edit-mode editable-cell" style="display:none;" value="${jgrKosong}" data-col="jgrKosong"></td>
                <td><span class="view-mode">${jgrPC}</span><input type="number" class="edit-mode editable-cell" style="display:none;" value="${jgrPC}" data-col="jgrPC"></td>
                <td><span class="view-mode">${jgrPET}</span><input type="number" class="edit-mode editable-cell" style="display:none;" value="${jgrPET}" data-col="jgrPET"></td>
                <td><span class="view-mode">${jgr10L}</span><input type="number" class="edit-mode editable-cell" style="display:none;" value="${jgr10L}" data-col="jgr10L"></td>
                <td><strong>${totalJgr}</strong></td>
                <td><span class="view-mode">${jgrRusak}</span><input type="number" class="edit-mode editable-cell" style="display:none;" value="${jgrRusak}" data-col="jgrRusak"></td>
                
                <!-- Botol Kosong & Siap Pakai -->
                <td><span class="view-mode">${lasahanPC}</span><input type="number" class="edit-mode editable-cell" style="display:none;" value="${lasahanPC}" data-col="lasahanPC"></td>
                <td><span class="view-mode">${lasahanPET}</span><input type="number" class="edit-mode editable-cell" style="display:none;" value="${lasahanPET}" data-col="lasahanPET"></td>
                <td><strong style="color: #0369a1; font-size: 12px;">${siapPC}</strong></td>
                <td><strong style="color: #0369a1; font-size: 12px;">${siapPET}</strong></td>

                <!-- FG (Angka Botol Murni) -->
                <td><span class="view-mode">${fgPC}</span><input type="number" class="edit-mode editable-cell" style="display:none;" value="${fgPC}" data-col="fgPC"></td>
                <td><span class="view-mode">${fgPET}</span><input type="number" class="edit-mode editable-cell" style="display:none;" value="${fgPET}" data-col="fgPET"></td>
                <td><span class="view-mode">${fg10L}</span><input type="number" class="edit-mode editable-cell" style="display:none;" value="${fg10L}" data-col="fg10L"></td>

                <!-- Afkir -->
                <td><span class="view-mode">${afkirPC}</span><input type="number" class="edit-mode editable-cell" style="display:none;" value="${afkirPC}" data-col="afkirPC"></td>
                <td><span class="view-mode">${afkirPET}</span><input type="number" class="edit-mode editable-cell" style="display:none;" value="${afkirPET}" data-col="afkirPET"></td>
                <td><span class="view-mode">${afkirLuar}</span><input type="number" class="edit-mode editable-cell" style="display:none;" value="${afkirLuar}" data-col="afkirLuar"></td>
            `;
            tbody.appendChild(tr);
        });
    }

    renderTable();

    // EDIT DATA PER BARIS
    function enableEdit(id) {
        let tr = document.getElementById(`row-${id}`);
        let viewModes = tr.querySelectorAll('.view-mode');
        let editModes = tr.querySelectorAll('.edit-mode');

        viewModes.forEach(el => el.style.display = 'none');
        editModes.forEach(el => el.style.display = 'inline-block');

        let actionTd = tr.children[0];
        actionTd.innerHTML = `<button class="btn btn-save" onclick="saveEdit('${id}')">💾 Save</button>`;
    }

    function saveEdit(id) {
        let history = JSON.parse(localStorage.getItem(DB_KEY) || '[]');
        let index = history.findIndex(item => item.id === id);

        if (index !== -1) {
            let tr = document.getElementById(`row-${id}`);
            let inputs = tr.querySelectorAll('.edit-mode');

            inputs.forEach(input => {
                let col = input.getAttribute('data-col');
                history[index][col] = parseInt(input.value, 10) || 0;
            });

            // Kalkulasi Ulang Total Jgr & Siap Pakai saat diedit
            let item = history[index];
            item.totalJgr = parseInt(item.jgrKosong||0) + parseInt(item.jgrPC||0) + parseInt(item.jgrPET||0) + parseInt(item.jgr10L||0);
            item.siapPC = (parseInt(item.jgrPC||0) * 48) + parseInt(item.lasahanPC||0);
            item.siapPET = (parseInt(item.jgrPET||0) * 48) + parseInt(item.lasahanPET||0);

            localStorage.setItem(DB_KEY, JSON.stringify(history));
            alert("Data berhasil diperbarui!");
            renderTable();
        }
    }

    // HAPUS DATA PER BARIS
    function deleteRow(id) {
        if (confirm(`Yakin ingin menghapus data ID: ${id}?`)) {
            let history = JSON.parse(localStorage.getItem(DB_KEY) || '[]');
            history = history.filter(item => item.id !== id);
            localStorage.setItem(DB_KEY, JSON.stringify(history));
            renderTable();
        }
    }

    // EXPORT EXCEL
    function exportToExcel() {
        let history = JSON.parse(localStorage.getItem(DB_KEY) || '[]');
        if (history.length === 0) {
            alert("Tidak ada data untuk di-export!");
            return;
        }

        let cleanHistory = history.map(item => {
            return {
                "ID": item.id,
                "Tanggal": item.tanggal_tampil,
                "Jam": item.jam_tampil,
                "Jgr Kosong": parseOnlyNumber(item.jgrKosong),
                "Jgr PC": parseOnlyNumber(item.jgrPC),
                "Jgr PET": parseOnlyNumber(item.jgrPET),
                "Jgr 10L": parseOnlyNumber(item.jgr10L),
                "Total Jgr": parseOnlyNumber(item.totalJgr),
                "Jgr Rusak": parseOnlyNumber(item.jgrRusak),
                "Lasahan PC": parseOnlyNumber(item.lasahanPC),
                "Lasahan PET": parseOnlyNumber(item.lasahanPET),
                "Siap PC": parseOnlyNumber(item.siapPC),
                "Siap PET": parseOnlyNumber(item.siapPET),
                "FG PC (Btl)": parseOnlyNumber(item.fgPC),
                "FG PET (Btl)": parseOnlyNumber(item.fgPET),
                "FG 10L (Btl)": parseOnlyNumber(item.fg10L),
                "Afkir PC": parseOnlyNumber(item.afkirPC),
                "Afkir PET": parseOnlyNumber(item.afkirPET),
                "Afkir Luar": parseOnlyNumber(item.afkirLuar)
            };
        });

        let wb = XLSX.utils.book_new();
        let ws = XLSX.utils.json_to_sheet(cleanHistory);
        XLSX.utils.book_append_sheet(wb, ws, "Rekap_Report");
        XLSX.writeFile(wb, `Rekap_Report_HOD.xlsx`);
    }
</script>

</body>
</html>
