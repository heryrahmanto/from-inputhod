<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Logistik</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
            margin: 0;
            padding: 20px 15px;
            color: #1e293b;
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
        }

        /* Header Bergaya Gradient */
        header {
            text-align: center;
            padding: 22px 15px;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #ffffff;
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.15);
        }

        header h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        /* Label Kategori Menu */
        .section-label {
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin: 20px 0 12px 4px;
            color: #475569;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Grid Tombol Menu */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        /* Style Kartu Tombol */
        .card {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px 12px;
            border-radius: 14px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 15px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            text-align: center;
        }

        .card:active {
            transform: scale(0.95);
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .card-icon {
            font-size: 26px;
            margin-bottom: 8px;
        }

        /* WARNA-WARNI TOMBOL MENU LOGISTIK */
        
        /* 1. Form Input */
        .btn-lasahan {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%); /* Biru */
        }
        
        .btn-jugrack-kosong {
            background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%); /* Amber / Oranye */
        }

        .btn-botol-jugrack {
            background: linear-gradient(135deg, #06b6d4 0%, #0e7490 100%); /* Cyan / Toska */
        }

        .btn-finish-good {
            background: linear-gradient(135deg, #10b981 0%, #047857 100%); /* Hijau Emerald */
        }

        .btn-afkir {
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%); /* Merah */
        }

        /* 2. Report */
        .btn-report-shift {
            background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%); /* Ungu Modern */
        }

        .btn-report-shift1 {
            background: linear-gradient(135deg, #ec4899 0%, #be185d 100%); /* Pink Magenta Modern */
        }

        .btn-report-shift2 {
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%); /* Biru Ocean */
        }

        .btn-tabel-report {
            background: linear-gradient(135deg, #059669 0%, #047857 100%); /* Hijau Teal */
        }

        .btn-dashboard {
            background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%); /* Indigo */
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- Header Utama -->
        <header>
            <h1>REPORT LOGISTIK</h1>
        </header>

        <!-- KELOMPOK 1: FORM INPUT -->
        <div class="section-label">📌 1. Form Input</div>
        <div class="menu-grid">
            <a href="lasahan.html" class="card btn-lasahan">
                <span class="card-icon">📦</span>
                <span>a. Lasahan</span>
            </a>
            
            <a href="jugrack-kosong.html" class="card btn-jugrack-kosong">
                <span class="card-icon">🔲</span>
                <span>b. Jugrack Kosong</span>
            </a>
            
            <a href="botol-jugrack.html" class="card btn-botol-jugrack">
                <span class="card-icon">🍾</span>
                <span>c. Botol Jugrack</span>
            </a>
            
            <a href="finish-good.html" class="card btn-finish-good">
                <span class="card-icon">✅</span>
                <span>d. Finish Good</span>
            </a>

            <a href="afkir-0011.html" class="card btn-afkir">
                <span class="card-icon">⚠️</span>
                <span>e. Afkir 0011</span>
            </a>
        </div>

        <!-- KELOMPOK 2: REPORT -->
        <div class="section-label">📊 2. Report</div>
        <div class="menu-grid">
            <a href="report-shift.html" class="card btn-report-shift">
                <span class="card-icon">📋</span>
                <span>a. Report Shift</span>
            </a>

            <a href="report-shift1.html" class="card btn-report-shift1">
                <span class="card-icon">📑</span>
                <span>b. Report Shift 1</span>
            </a>

            <!-- Tombol Report Shift 2 -->
            <a href="report-shift2.html" class="card btn-report-shift2">
                <span class="card-icon">📄</span>
                <span>c. Report Shift 2</span>
            </a>

            <!-- Tombol Tabel Report Rekap -->
            <a href="tabel-report.html" class="card btn-tabel-report">
                <span class="card-icon">📊</span>
                <span>d. Tabel Report</span>
            </a>
            
            <a href="dashboard.html" class="card btn-dashboard">
                <span class="card-icon">📈</span>
                <span>e. Dashboard</span>
            </a>
        </div>

    </div>

</body>
</html>
