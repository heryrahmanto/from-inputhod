<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logistics Report</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      margin: 0;
      padding: 20px;
      /* Background Biru Keramat Pabrik */
      background: linear-gradient(135deg, #003366, #004080);
      min-height: 100vh;
      color: white;
      display: flex;
      justify-content: center;
    }
    .container { 
      width: 100%;
      max-width: 500px; 
    }
    
    /* HEADER BANNER KACA */
    .header { 
      text-align: center; 
      margin-bottom: 25px; 
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 20px 15px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }
    .header h1 {
      margin: 0;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #ffffff;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }
    .header p {
      margin-top: 6px;
      margin-bottom: 0;
      opacity: 0.9;
      font-size: 13px;
      color: #e2e8f0;
      letter-spacing: 0.5px;
    }
    
    /* MENU HEADERS */
    .menu-group {
      margin-bottom: 15px;
    }
    .menu-header {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      padding: 16px 20px;
      border-radius: 12px;
      font-weight: 600;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }
    .arrow {
      font-size: 12px;
      transition: transform 0.3s;
    }

    /* SUBMENU */
    .submenu {
      display: none;
      margin-top: 8px;
      padding: 0 5px;
    }
    .submenu a {
      display: flex;
      align-items: center;
      padding: 12px 15px;
      color: #ffffff;
      text-decoration: none;
      font-size: 15px;
      border-radius: 8px;
      margin-bottom: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      transition: background 0.2s;
    }
    .submenu a:active {
      background: rgba(255, 255, 255, 0.3);
    }
    .submenu a span {
      margin-right: 12px;
    }

    /* TOGGLE ACTIVE */
    .menu-group.active .submenu { 
      display: block; 
    }
    .menu-group.active .arrow {
      transform: rotate(180deg);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>REPORT LOGISTIK</h1>
      <p>Sistem Input & Pelaporan Operasional</p>
    </div>

    <!-- Group 1 (Ditambahkan ID khusus) -->
    <div class="menu-group" id="menu-input" onclick="toggleGroup(this)">
      <div class="menu-header">
        <span>1. Form Input</span>
        <span class="arrow">▼</span>
      </div>
      <div class="submenu">
        <a href="lasahan.html"><span>📦</span> a. Lasahan</a>
        <a href="botol-jugrack.html"><span>🍾</span> b. Botol Jugrack</a>
        <a href="jugrack-kosong.html"><span>🔲</span> c. Jugrack Kosong</a>
        <a href="finish-good.html"><span>✅</span> d. Finish Good</a>
        <a href="afkir-0011.html"><span>⚠️</span> e. Afkir 0011</a>
      </div>
    </div>

    <!-- Group 2 (Ditambahkan ID khusus) -->
    <div class="menu-group" id="menu-rekap" onclick="toggleGroup(this)">
      <div class="menu-header">
        <span>2. Rekap & Report</span>
        <span class="arrow">▼</span>
      </div>
      <div class="submenu">
        <a href="report-shift.html"><span>📋</span> a. Report Shift</a>
        <a href="report-shift1.html"><span>📑</span> b. Report Shift 1</a>
        <a href="report-shift2.html"><span>📄</span> c. Report Shift 2</a>
        <a href="tabel-report.html"><span>📊</span> d. Tabel Report</a>
        <a href="dashboard.html"><span>📈</span> e. Dashboard</a>
      </div>
    </div>
  </div>

  <script>
    // 1. Saat halaman dimuat, cek Local Storage untuk melihat status terakhir menu
    document.addEventListener('DOMContentLoaded', () => {
      const groups = document.querySelectorAll('.menu-group');
      
      groups.forEach(group => {
        const groupId = group.id; // Ambil ID (contoh: menu-input)
        const savedState = localStorage.getItem('status_' + groupId);
        
        // Jika catatannya bilang 'buka', tambahkan class active agar otomatis terbuka
        if (savedState === 'buka') {
          group.classList.add('active');
        }
      });
    });

    // 2. Fungsi untuk toggle (Buka/Tutup) sekaligus menyimpan statusnya
    function toggleGroup(element) {
      element.classList.toggle('active');
      
      const groupId = element.id;
      
      // Cek apakah menu sedang terbuka atau tertutup, lalu simpan ke Local Storage
      if (element.classList.contains('active')) {
        localStorage.setItem('status_' + groupId, 'buka');
      } else {
        localStorage.setItem('status_' + groupId, 'tutup');
      }
    }

    // Biar pas link a, b, c diklik BISA MASUK & GAK BENTROK
    document.querySelectorAll('.submenu a').forEach(link => {
      link.addEventListener('click', (event) => {
        event.stopPropagation();
      });
    });
  </script>
</body>
</html>
